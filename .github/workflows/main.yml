name: Build Jujutsu Kernel (ReSukiSU + SUSFS, ZyC Clang)

on:
  push:
    branches:
      - clang-test        # experiment branch, NOT V7
  workflow_dispatch:

env:
  KERNEL_DEFCONFIG: "blossom_defconfig"
  KERNEL_ARCH: "arm64"
  KBUILD_BUILD_USER: "github-actions"
  KBUILD_BUILD_HOST: "ci-server"
  # Fill this in from https://github.com/ZyCromerZ/Clang/releases
  # Copy the exact asset URL of ONE release tag. Never use "latest".
  ZYC_CLANG_URL: "https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz"
  # ReSukiSU commit, must match the vendored SUSFS files
  RESUKISU_COMMIT: "6d18926ae6eeb571a04c1ce7552c324d606fa9d8"

jobs:
  build_and_package:
    name: Build Kernel & Package AnyKernel3
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Integrate NoMount
        run: |
          set -eo pipefail
          curl -fLSs "https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh" | bash -s v2.0.0

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libelf-dev cpio kmod git zip curl ca-certificates jq \
            zstd xz-utils lld ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Configure git
        run: |
          git config --global url."https://".insteadOf git://
          
      - name: Configure Compiler Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # CHANGED: We use a fixed string "v1" instead of the commit hash.
          # GitHub will now update the same cache database rather than making duplicate giant files.
          key: ${{ runner.os }}-kernel-ccache-v1
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Download ZyC Clang
        run: |
          set -eo pipefail
          if [[ "$ZYC_CLANG_URL" == PASTE_* ]]; then
            echo "::error::Set ZYC_CLANG_URL to a real release asset URL"
            exit 1
          fi
          mkdir -p /tmp/clang
          curl -fL --retry 3 -o /tmp/zyc_clang.tar "$ZYC_CLANG_URL"
          tar -C /tmp/clang -xf /tmp/zyc_clang.tar
          rm -f /tmp/zyc_clang.tar
          CLANG_BIN="/tmp/clang/bin"
          if [ ! -x "$CLANG_BIN/clang" ]; then
            echo "::error::clang not found in $CLANG_BIN"
            ls -la "$CLANG_BIN" | grep -i clang || true
            exit 1
          fi
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          
      - name: Verify toolchain
        run: |
          clang --version
          ld.lld --version || true
          aarch64-linux-gnu-gcc --version | head -1
          arm-linux-gnueabi-gcc --version | head -1

      - name: Integrate ReSukiSU (pinned)
        run: |
          set -eo pipefail
          curl -fLSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/${RESUKISU_COMMIT}/kernel/setup.sh" | bash -s "${RESUKISU_COMMIT}"

      - name: Strip -Werror from vendor drivers
        run: |
          find drivers -type f \( -name 'Makefile*' -o -name 'Kbuild*' \) -print0 \

            | xargs -0 sed -i 's/-Werror[^ ]*//g' || true

      - name: Build kernel
        run: |
          set -eo pipefail
          export ARCH=${KERNEL_ARCH}
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          
          # ADDED/CHANGED ccache settings
          ccache -M 5G
          echo "=== CCACHE INITIAL STATS ==="
          ccache -s                  # Prints stats before the build starts
          
          MAKE_ARGS=(
            O=out
            ARCH=${ARCH}
            CC="ccache clang"
            HOSTCC=clang
            HOSTCXX=clang++
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            OBJSIZE=llvm-size
            READELF=llvm-readelf
            STRIP=llvm-strip
            CLANG_TRIPLE=${CLANG_TRIPLE}
            CROSS_COMPILE=${CROSS_COMPILE}
            CROSS_COMPILE_ARM32=${CROSS_COMPILE_ARM32}
            KCFLAGS="-Wno-error"
          )
          make "${MAKE_ARGS[@]}" ${KERNEL_DEFCONFIG}
          echo "Building Jujutsu Kernel with ZyC Clang..."
          make -j"$(nproc)" "${MAKE_ARGS[@]}" 2>&1 | tee build.log
          
          echo "=== CCACHE FINAL STATS ==="
          ccache -s                  # ADDED: Prints stats AFTER the build finishes!


      - name: Show first errors
        if: failure()
        run: |
          grep -nE "error:|Error [0-9]|undefined reference" build.log | head -40 || true

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/Iam-nishan/anykernel.git anykernel
          cd anykernel
          rm -f zImage *.dtb

          if [ -f "../out/arch/${KERNEL_ARCH}/boot/Image.gz-dtb" ]; then
            cp ../out/arch/${KERNEL_ARCH}/boot/Image.gz-dtb Image.gz-dtb
            echo "✓ Copied Image.gz-dtb"
          elif [ -f "../out/arch/${KERNEL_ARCH}/boot/Image.gz" ]; then
            cp ../out/arch/${KERNEL_ARCH}/boot/Image.gz Image.gz
            echo "✓ Copied Image.gz"
          elif [ -f "../out/arch/${KERNEL_ARCH}/boot/Image" ]; then
            cp ../out/arch/${KERNEL_ARCH}/boot/Image Image
            echo "✓ Copied Image"
          else
            echo "✗ No kernel image found!"
            ls -lah ../out/arch/${KERNEL_ARCH}/boot/
            exit 1
          fi

          cp ../out/arch/${KERNEL_ARCH}/boot/dtb*.img . 2>/dev/null || echo "No DTB files"

          cat > anykernel.sh << 'EOF'
          properties() { '
          kernel.string=Jujutsu Kernel for blossom by Nishan Najmal aka kurama9-tails on XDA
          do.devicecheck=1
          device.name1=blossom
          device.name2=dandelion
          device.name3=angelica
          device.name4=angelican
          device.name5=cattail
          device.name6=angelicain
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          '; }

          block=/dev/block/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF

          zip -r9 ../Jujutsu-Kernel-${{ github.sha }}.zip * -x .git README.md *placeholder

      - name: Upload AnyKernel package
        uses: actions/upload-artifact@v7
        with:
          name: Jujutsu-Kernel-KSU
          path: Jujutsu-Kernel-${{ github.sha }}.zip
          archive: false
          retention-days: 30
          compression-level: 0

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.sha }}
          path: build.log
          retention-days: 7
