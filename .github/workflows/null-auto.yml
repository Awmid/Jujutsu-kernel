name: Cache Keep-Alive

on:
  schedule:
    - cron: '0 0 * * 3,0'   # Wed + Sun, 00:00 UTC
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-22.04
    steps:
      - name: Touch ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-kernel-ccache-keepalive-nomatch
          restore-keys: |
            ${{ runner.os }}-kernel-ccache-

      - name: Touch ZyC Clang
        uses: actions/cache/restore@v4
        with:
          path: /tmp/clang
          key: zyc-clang-16.0.6-20260807